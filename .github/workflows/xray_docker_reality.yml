name: xray_docker_reality

on:
  workflow_dispatch:
  schedule:
    - cron: '0 20 */2 * *'  # UTC 20:00  UTC+8 04:00
  push:
    paths:
      - 'reality/Dockerfile'
      - '.github/workflows/xray_docker_reality.yml'
      - 'reality/entrypoint.sh'
      - 'reality/config.json'
      - 'reality/Caddyfile'
      - 'reality/www/**'
      - 'reality/VERSION'
  pull_request:
    paths:
      - 'reality/Dockerfile'
      - '.github/workflows/xray_docker_reality.yml'
      - 'reality/entrypoint.sh'
      - 'reality/config.json'
      - 'reality/Caddyfile'
      - 'reality/www/**'
      - 'reality/VERSION'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.2.0

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Docker Login
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.4.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Read image version
        shell: bash
        run: |
          VERSION=$(cat reality/VERSION)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Get latest Xray-core version (including pre-release)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +x
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::Missing GitHub Actions token."
            exit 1
          fi
          tmp_dir=$(mktemp -d)
          trap 'rm -rf "$tmp_dir"' EXIT

          # Pass the token on stdin, not in command-line arguments.
          if ! http_status=$(
            printf 'header = "Authorization: Bearer %s"\n' "$GH_TOKEN" |
              (
                unset GH_TOKEN
                curl -q --config - --silent --proto '=https' \
                  --connect-timeout 10 --max-time 30 \
                  --header 'Accept: application/vnd.github+json' \
                  --dump-header "$tmp_dir/headers" --output "$tmp_dir/body" \
                  --write-out '%{http_code}' \
                  'https://api.github.com/repos/XTLS/Xray-core/releases?per_page=1' 2>/dev/null
              )
          ); then
            echo "::error::GitHub release lookup failed before receiving an HTTP response."
            exit 1
          fi
          unset GH_TOKEN

          if [[ "$http_status" != 200 ]]; then
            echo "::error::GitHub release lookup returned HTTP $http_status."
            # Print only known rate-limit headers with numeric values.
            awk -F ': *' '
              { sub(/\r$/, "", $2); key = tolower($1) }
              NF == 2 && $2 ~ /^[0-9]+$/ &&
                key ~ /^(x-ratelimit-limit|x-ratelimit-remaining|x-ratelimit-reset|retry-after)$/ {
                  print key ": " $2
                }
            ' "$tmp_dir/headers"
            exit 1
          fi

          # Keep upstream data out of the log and reject unsafe Docker tag characters.
          if ! LATEST_VERSION=$(jq -er '.[0].tag_name | strings | select(test("\\A[A-Za-z0-9_][A-Za-z0-9_.-]{0,95}\\z"))' "$tmp_dir/body" 2>/dev/null); then
            echo "::error::GitHub release response did not contain a valid Xray-core tag."
            exit 1
          fi
          echo "XRAY_VERSION=$LATEST_VERSION" >> "$GITHUB_ENV"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7.3.0
        with:
          context: ./reality
          file: ./reality/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6
          build-args: |
            XRAY_VERSION=${{ env.XRAY_VERSION }}
          tags: |
            wulabing/xray_docker_reality:${{ env.VERSION }}-ubuntu-24.04-xray-${{ env.XRAY_VERSION }}
            wulabing/xray_docker_reality:latest
          push: ${{ github.event_name != 'pull_request' }}
